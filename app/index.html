<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Release Tracker</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172b45;max-width:720px;margin:60px auto;padding:20px}li{background:white;padding:15px;margin:8px 0;display:flex;gap:12px;align-items:center}li span{flex:1}button,input{font:inherit;padding:9px}button{cursor:pointer}form{display:flex;gap:8px}input{flex:1}</style><h1>Release Tracker</h1><p>Track release readiness and deployment tasks.</p><form id="form"><input id="title" required maxlength="120" placeholder="New release task"><button>Add task</button></form><p id="error" role="alert"></p><ul id="list"></ul><script>const list=document.querySelector('#list'),error=document.querySelector('#error');async function api(path,method='GET',data){const r=await fetch('/api/tasks'+path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('Request failed: '+r.status);return r.status===204?null:r.json()}async function run(fn){try{error.textContent='';await fn();await load()}catch(e){error.textContent=e.message}}async function load(){const tasks=await api('');list.replaceChildren();for(const t of tasks){const li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button'),d=document.createElement('button');s.textContent=t.title;b.textContent=t.done?'Reopen':'Complete';d.textContent='Delete';b.onclick=()=>run(()=>api('/'+t.id,'PUT',{title:t.title,done:!t.done}));d.onclick=()=>run(()=>api('/'+t.id,'DELETE'));li.append(s,b,d);list.append(li)}}document.querySelector('#form').onsubmit=e=>{e.preventDefault();run(async()=>{const i=document.querySelector('#title');await api('','POST',{title:i.value});i.value=''})};run(async()=>{});</script></html>
